name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            xvfb \
            libgl1 libegl1 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      # Linux não tem display por padrão no runner -- os testes de UI
      # (test_ui_navigation.py/test_ui_theme.py, via pytest-qt) instanciam
      # MainWindow de verdade e precisam de um backend Qt sem X server real.
      # xvfb-run abortava (SIGABRT) na primeiríssima QApplication() da suíte
      # neste runner/versão do Qt (reproduzido 3x seguidas no release da
      # v2.0.0, sem traceback Python legível -- crash no nível XCB/C++, não
      # algo corrigível em código da aplicação). QT_QPA_PLATFORM=offscreen é
      # o plugin de plataforma do próprio Qt pra teste headless: não abre
      # conexão X11/XCB nenhuma, então não depende de xvfb nem do stack XCB
      # do sistema -- mais robusto pra CI. A suíte não faz captura de tela
      # baseada em pixel (isso vive em scripts/visual_regression.py,
      # separado, não roda aqui), só estado lógico de widget/sinal, que o
      # offscreen suporta igual a um display real. Windows/macOS já têm
      # display nativo no runner, então rodam pytest direto.
      - name: Rodar testes (Linux — offscreen)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v -m "not live"

      - name: Rodar testes (Windows/macOS)
        if: runner.os != 'Linux'
        run: pytest tests/ -v -m "not live"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: NOCPing.exe
            asset_name: NOCPing-Windows.exe
          - os: ubuntu-latest
            artifact_name: NOCPing
            asset_name: NOCPing-Linux
          - os: macos-latest
            artifact_name: NOCPing
            asset_name: NOCPing-macOS

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1 libegl1 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libxkbcommon-x11-0 libxcb-cursor0

      - name: Instalar dependências Python
        # Antes instalava uma lista fixa (PyQt6 pyqtgraph darkdetect
        # pyinstaller) que nunca foi atualizada quando qtawesome virou
        # dependência no redesign visual -- o binário publicado da v2.0.0
        # não tinha qtawesome instalado e crashava no primeiro import
        # (ModuleNotFoundError: No module named 'qtawesome'). Usar
        # requirements.txt aqui garante que build nunca mais diverge do
        # que o app realmente declara precisar.
        run: pip install -r requirements.txt

      - name: Instalar Pillow (macOS — converte .ico → .icns)
        if: runner.os == 'macOS'
        run: pip install Pillow

      - name: Build executável
        run: >
          python -m PyInstaller
          --onefile --windowed
          --name NOCPing
          --icon NOCPing.ico
          --hidden-import PyQt6.sip
          --hidden-import darkdetect
          --hidden-import pyqtgraph
          --collect-data qtawesome
          --add-data "NOCPing.ico:."
          main.py

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Preparar arquivos
        run: |
          cp artifacts/NOCPing-Windows.exe/NOCPing.exe NOCPing-Windows.exe
          cp artifacts/NOCPing-Linux/NOCPing           NOCPing-Linux
          cp artifacts/NOCPing-macOS/NOCPing           NOCPing-macOS
          chmod +x NOCPing-Linux NOCPing-macOS

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: NOCPing ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            NOCPing-Windows.exe
            NOCPing-Linux
            NOCPing-macOS
